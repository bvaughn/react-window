name: "TypeScript"
on:
  push:
    branches: [main]
  pull_request:
jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
          cache: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --recursive
      - name: Build NPM package
        run: pnpm build
      - name: Run TypeScript
        run: pnpm tsc
