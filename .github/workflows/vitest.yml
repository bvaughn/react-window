name: "Vitest"
on:
  push:
    branches: [main]
  pull_request:
jobs:
  unit-tests:
    name: unit-tests (React ${{ matrix.react }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        react: [18, 19]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
          cache: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --recursive
      - name: Install React ${{ matrix.react }}
        if: matrix.react != 19
        run: pnpm add --workspace-root --save-dev react@^${{ matrix.react }} react-dom@^${{ matrix.react }}
      # Tests import the library source (not dist), and the TypeScript workflow verifies the build
      - name: Run tests
        run: pnpm run test:ci
