name: "Playwright Tests"
on:
  push:
    branches: [main]
  pull_request:
jobs:
  e2e-tests:
    name: e2e-tests (${{ matrix.browser }}, ${{ matrix.shard }}/2)
    runs-on: ubuntu-24.04
    strategy:
      # Let other browsers finish if one fails
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
          cache: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --recursive

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(pnpm -C integrations/tests exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser binaries
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright # Default Linux path
          key: ${{ runner.os }}-playwright-${{ matrix.browser }}-${{ steps.playwright-version.outputs.version }}

      # The browser binaries are cached, but their system dependencies are not.
      # The runner image already has the libraries Chromium and Firefox need (install-deps only adds optional fonts),
      # but WebKit needs additional packages.
      #
      # Installing is mostly network bound, so it runs in the background while the library builds and the dev servers warm up.
      - name: Install Playwright browsers and/or system dependencies (in background)
        id: playwright-install
        if: steps.playwright-cache.outputs.cache-hit != 'true' || matrix.browser == 'webkit'
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            COMMAND="install-deps"
          else
            COMMAND="install --with-deps"
          fi
          (
            pnpm -C integrations/tests exec playwright $COMMAND ${{ matrix.browser }}
            echo $? > "$RUNNER_TEMP/playwright-install.exit"
          ) > "$RUNNER_TEMP/playwright-install.log" 2>&1 &

      - name: Build library
        run: pnpm prerelease
        env:
          # The integration apps don't need type declarations
          SKIP_DTS: "true"

      - name: Start integration dev servers (in background)
        run: pnpm dev:integrations > "$RUNNER_TEMP/dev-servers.log" 2>&1 &

      - name: Wait for Playwright install
        if: steps.playwright-install.outcome == 'success'
        timeout-minutes: 5
        run: |
          while [ ! -f "$RUNNER_TEMP/playwright-install.exit" ]; do sleep 1; done
          cat "$RUNNER_TEMP/playwright-install.log"
          exit "$(cat "$RUNNER_TEMP/playwright-install.exit")"

      - name: Run Playwright tests
        run: pnpm e2e:test --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/2

      - name: Print dev server logs
        if: failure()
        run: cat "$RUNNER_TEMP/dev-servers.log"

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.browser }}-${{ matrix.shard }}
          path: integrations/tests/test-results/
          retention-days: 14
